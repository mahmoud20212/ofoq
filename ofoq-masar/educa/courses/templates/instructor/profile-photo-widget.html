<div class="teacher-upload" data-upload><div class="teacher-upload-preview" data-upload-preview>{% if widget.is_initial %}<img src="{{ widget.value.url }}" alt="الصورة الشخصية الحالية">{% else %}{% include 'students/dashboard/icon.html' with name='user' %}{% endif %}</div><div class="teacher-upload-content"><strong>الصورة الشخصية</strong><p data-upload-name>{% if widget.is_initial %}يمكنك استبدال الصورة الحالية{% else %}اختر صورة لملفك العام{% endif %}</p><div class="teacher-upload-actions"><span class="teacher-upload-picker"><input type="{{ widget.type }}" name="{{ widget.name }}"{% include 'django/forms/widgets/attrs.html' %}><label for="{{ widget.attrs.id }}">اختيار الصورة</label></span>{% if widget.is_initial and not widget.required %}<label class="teacher-upload-remove" for="{{ widget.checkbox_id }}"><input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}>إزالة الصورة</label>{% endif %}</div></div></div>
