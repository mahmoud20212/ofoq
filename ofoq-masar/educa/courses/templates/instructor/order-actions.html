<form method="post" action="{% url 'instructor:structure' revision.pk kind item.pk 'up' %}">{% csrf_token %}<button class="teacher-order-button" aria-label="تحريك {{ item.title }} للأعلى" title="تحريك للأعلى">↑</button></form><form method="post" action="{% url 'instructor:structure' revision.pk kind item.pk 'down' %}">{% csrf_token %}<button class="teacher-order-button" aria-label="تحريك {{ item.title }} للأسفل" title="تحريك للأسفل">↓</button></form><form method="post" action="{% url 'instructor:structure' revision.pk kind item.pk 'delete' %}" data-confirm-delete data-action-title="حذف {{ item.title }}">{% csrf_token %}<button class="teacher-delete-button">حذف</button></form>
