<div class="assessment-option" data-option-row>
  {{ option_form.id }}{{ option_form.id.errors }}
  <div class="assessment-option-line"><button type="button" class="teacher-drag-handle assessment-option-handle" data-option-handle hidden aria-label="ترتيب الخيار بالسحب أو بسهمي الأعلى والأسفل">{% load static %}<svg class="icon lucide-icon" width="18" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="{% static 'vendor/lucide/masar-icons.svg' %}#grip-vertical" width="24" height="24"/></svg></button><label class="assessment-correct-choice"><input type="radio" name="correct_option" value="{{ option_form.prefix }}"{% if correct_option == option_form.prefix %} checked{% endif %} aria-label="تحديد هذا الخيار كالإجابة الصحيحة"></label><div class="assessment-option-input teacher-field"><label class="sr-only" for="{{ option_form.text.id_for_label }}">نص الخيار</label>{{ option_form.text }}{{ option_form.text.errors }}</div><button type="button" class="teacher-danger-button" data-option-remove hidden aria-label="حذف الخيار">{% include 'students/dashboard/icon.html' with name='trash' %}</button></div>
  <div class="assessment-option-footer">{% include 'instructor/field.html' with field=option_form.order %}<div class="assessment-option-move"><button type="button" class="student-outline-button" data-option-up aria-label="نقل الخيار للأعلى">↑</button><button type="button" class="student-outline-button" data-option-down aria-label="نقل الخيار للأسفل">↓</button></div><label class="assessment-option-delete-fallback">{{ option_form.DELETE }} حذف الخيار عند الحفظ</label></div>{{ option_form.non_field_errors }}
</div>
