<div data-lab-formset data-prefix="{{ group.prefix }}">{{ group.management_form }}{{ group.non_form_errors }}<div data-lab-rows>{% for row in group %}<fieldset class="lab-row"><legend>{{ title }} {{ forloop.counter }}</legend>{{ row.non_field_errors }}{% for field in row %}<div class="lab-field">{{ field.as_field_group }}</div>{% endfor %}</fieldset>{% endfor %}</div><template data-lab-empty><fieldset class="lab-row"><legend>{{ title }}</legend>{% for field in group.empty_form %}<div class="lab-field">{{ field.as_field_group }}</div>{% endfor %}</fieldset></template><button class="student-outline-button" type="submit" formnovalidate name="add_rows" value="{{ group.prefix }}" data-lab-add>+ إضافة {{ title }}</button></div>
