<div class="teacher-field" data-field="{{ field.name }}">{% if field.field.required %}<label for="{{ field.id_for_label }}">{{ field.label }} <span class="teacher-required-star" aria-hidden="true">*</span><span class="sr-only"> (مطلوب)</span></label>{% else %}{{ field.label_tag }}{% endif %}{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</div>
