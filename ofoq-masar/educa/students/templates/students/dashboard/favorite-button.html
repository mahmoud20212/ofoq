<form method="post" action="{% url 'student_favorite_update' course.pk %}" class="course-favorite-form" data-favorite-form data-course-id="{{ course.pk }}">
  {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><input type="hidden" name="action" value="{% if course.is_favorite %}remove{% else %}add{% endif %}">
  <button type="submit" class="course-favorite-button" aria-pressed="{% if course.is_favorite %}true{% else %}false{% endif %}" aria-label="{% if course.is_favorite %}إزالة من المفضلة{% else %}إضافة إلى المفضلة{% endif %}: {{ course.title }}" data-course-title="{{ course.title }}" title="المفضلة">{% load static %}<svg class="icon lucide-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use class="lucide-heart-outline" href="{% static 'vendor/lucide/masar-icons.svg' %}#heart-regular" width="24" height="24"/><use class="lucide-heart-filled" href="{% static 'vendor/lucide/masar-icons.svg' %}#heart" width="24" height="24"/></svg></button>
</form>
